name: CI

on:
  push:
    # dev 是本 fork 的默认分支（上游同步落在 dev），加进来才有 lint/typecheck/test 门禁
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：写了会和 package.json 的 packageManager (pnpm@10.14.0) 冲突，
        # 报 "Multiple versions of pnpm specified"。留空即自动读 packageManager。


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:strict

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_STORAGE_TYPE: localstorage
